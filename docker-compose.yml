services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3